## 🐛 Workflow 3: Расследование инцидента / Flaky Tests

```yaml
workflow: incident-investigation
trigger: множественные падения автотестов / продакшен-инцидент
steps:
  - step: 1
    skill: kiwi-debug-failed-flaky-autotests
    input: логи падений, история запусков
    output: root-cause.analysis.yml
    params:
      classification: true # flake / test defect / product defect / environment
    description: Классификация причин падений
    
  - step: 2
    skill: kiwi-detect-duplicate-test-cases
    input: ID падающих тестов
    output: duplicates.report.yml
    params:
      confidence-threshold: 80
    description: Поиск дублей (возможная причина нестабильности)
    
  - step: 3
    skill: kiwi-automation-consolidation
    input: duplicates.report.yml
    output: consolidation-plan.yml
    params:
      type: clone | same-scenario-different-data | overlapping
    description: План консолидации дублирующихся автотестов
    
  - step: 4
    skill: kiwi-split-testing-levels-pyramid
    input: consolidation-plan.yml
    output: testing-pyramid.yml
    description: Перераспределение тестов по уровням пирамиды
```

