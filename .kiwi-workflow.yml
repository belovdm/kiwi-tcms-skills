## 📊 Workflow 5: Аудит качества (Quality Audit)

```yaml
workflow: quality-audit
trigger: квартальный аудит / инициатива улучшений
steps:
  - step: 1
    skill: kiwi-assess-maturity-level
    input: доступ к Kiwi TCMS, репозиторию
    output: maturity.assessment.yml
    params:
      levels: L1-L5
      dimensions: [process, coverage, automation, stability, team]
    description: Комплексная оценка зрелости QA-процессов
    
  - step: 2
    skill: kiwi-scan-automation-project
    input: пути к репозиториям с автотестами
    output: automation-inventory.yml
    description: Полная инвентаризация автотестов
    
  - step: 3
    skill: kiwi-detect-duplicate-test-cases
    input: все тест-кейсы из Kiwi TCMS
    output: duplicates.report.yml
    description: Поиск дублей тест-кейсов
    
  - step: 4
    skill: kiwi-automation-consolidation
    input: automation-inventory.yml + duplicates.report.yml
    output: consolidation-roadmap.yml
    description: План устранения технического долга
    
  - step: 5
    skill: kiwi-plan-process-improvement
    input: maturity.assessment.yml + consolidation-roadmap.yml
    output: improvement-plan.yml
    params:
      timeframe: quarterly
      priorities: top-5
    description: Дорожная карта улучшений на квартал
```

