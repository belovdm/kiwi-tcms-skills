## 🧪 Workflow 6: Исследовательское тестирование (Exploratory Testing)

```yaml
workflow: exploratory-testing
trigger: новая фича / сложный баг / время на эксперименты
steps:
  - step: 1
    skill: kiwi-exploratory-testing-session
    input: область исследования, таймбокс
    output: session-notes.md, charters.md
    params:
      duration: 90 # минут
      focus: [usability, edge-cases, security]
    description: Структурированная сессия исследовательского тестирования
    
  - step: 2
    skill: kiwi-write-test-cases
    input: найденные сценарии из session-notes.md
    output: новые тест-кейсы в Kiwi TCMS
    params:
      source: exploratory
    description: Формализация успешных чартеров в тест-кейсы
```

