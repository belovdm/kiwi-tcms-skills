## 🚀 Workflow 4: Подготовка к релизу (Pre-Release)

```yaml
workflow: pre-release
trigger: запланированный релиз / code freeze
steps:
  - step: 1
    skill: kiwi-performance-testing
    input: критические пользовательские сценарии
    output: performance.report.yml
    params:
      types: [load, stress, spike]
      tool: k6 # или jmeter, gatling
      sla:
        p95_latency_ms: 500
        error_rate_percent: 0.1
    description: Нагрузочное тестирование ключевых сценариев
    
  - step: 2
    skill: kiwi-accessibility-testing
    input: URL основных страниц
    output: a11y.report.yml
    params:
      wcag_level: AA
      tools: [axe-core, manual]
    description: Проверка доступности по WCAG 2.1/2.2
    
  - step: 3
    skill: kiwi-api-contract-testing
    input: OpenAPI spec / GraphQL schema
    output: contract.validation.yml
    params:
      check-breaking-changes: true
      pact-broker-url: https://pact.example.com
    description: Валидация контрактов API, поиск breaking changes
    
  - step: 4
    skill: kiwi-assess-maturity-level
    input: все артефакты workflow
    output: maturity.assessment.yml
    params:
      focus: [coverage, automation, stability]
    description: Финальная оценка готовности к релизу
    
  - step: 5
    skill: kiwi-sprint-report
    input: Kiwi TCMS project ID, sprint dates
    output: sprint.qa.report.yml
    description: Итоговый отчёт для стейкхолдеров
```

