# 🔄 Kiwi TCMS Skills Workflow

Этот файл описывает рекомендуемый порядок использования скиллов в различных сценариях QA-процесса.

## 📋 Глобальные артефакты

| Файл | Описание | Создаётся скиллами |
| --- | --- | --- |
| `.kiwi-workflow.yml` | Конфигурация workflow (этот файл) | — |
| `requirements.analysis.yml` | Анализ требований | `kiwi-requirement-analyzer`, `kiwi-requirement-reviewer` |
| `pr.changes.yml` | Изменения в PR | `kiwi-detect-changes-in-pr` |
| `coverage.tests.yml` | Матрица покрытия | `kiwi-assess-maturity-level` |
| `automation-inventory.yml` | Инвентарь автотестов | `kiwi-scan-automation-project` |
| `testing-pyramid.yml` | Распределение по уровням | `kiwi-split-testing-levels-pyramid` |
| `duplicates.report.yml` | Отчёт о дублях | `kiwi-detect-duplicate-test-cases`, `kiwi-automation-consolidation` |
| `root-cause.analysis.yml` | Анализ причин падений | `kiwi-debug-failed-autotest`, `kiwi-debug-failed-flaky-autotests` |
| `performance.report.yml` | Отчёт по performance | `kiwi-performance-testing` |
| `a11y.report.yml` | Отчёт по доступности | `kiwi-accessibility-testing` |
| `contract.validation.yml` | Валидация контрактов API | `kiwi-api-contract-testing` |
| `sprint.qa.report.yml` | Отчёт за спринт | `kiwi-sprint-report` |
| `maturity.assessment.yml` | Оценка зрелости | `kiwi-assess-maturity-level` |

