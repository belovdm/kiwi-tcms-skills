## 🎯 Workflow 1: Новая фича (Feature Development)

```yaml
workflow: feature-development
trigger: новый user story / требование
steps:
  - step: 1
    skill: kiwi-requirement-reviewer
    input: текст требования из Jira/Confluence
    output: requirements.analysis.yml
    description: Проверка на тестопригодность, поиск неоднозначностей
    
  - step: 2
    skill: kiwi-requirement-analyzer
    input: утверждённое требование
    output: список тестовых сценариев
    description: Извлечение acceptance criteria, тестовых сценариев
    
  - step: 3
    skill: kiwi-write-test-cases
    input: сценарии от предыдущего шага
    output: тест-кейсы в Kiwi TCMS
    params:
      language: ru
      type: functional
    description: Создание детальных тест-кейсов с шагами и ожидаемыми результатами
    
  - step: 4
    skill: kiwi-generate-checklist-from-requirements
    input: требование
    output: smoke-checklist.md
    description: Чек-лист для быстрого смоук-тестирования
    
  - step: 5 (опционально)
    skill: kiwi-data-seeder
    input: требования к данным
    output: seed-data.sql / seed-data.json
    params:
      balance: 70/30 # позитив/негатив
    description: Генерация тестовых данных
```

