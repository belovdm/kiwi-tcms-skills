## ✅ Чек-лист перед запуском workflow

- [ ] Установлен и настроен MCP-сервер Kiwi TCMS
- [ ] Есть доступ к Kiwi TCMS API (токен в `.env`)
- [ ] Скиллы установлены: `npx @kiwi-tcms-ai/kiwi-tcms-skills add`
- [ ] Проверена валидация: `npx tsx scripts/validate-skills.ts`
- [ ] Настроены переменные окружения (KIWI_URL, KIWI_API_TOKEN)

