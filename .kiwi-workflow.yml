## 📈 Метрики и KPI

| Метрика | Как измеряется | Целевое значение |
| --- | --- | --- |
| **Test Coverage** | `kiwi-assess-maturity-level` | >80% критических путей |
| **Automation Rate** | `automation-inventory.yml` | >70% регрессионных тестов |
| **Flaky Rate** | `root-cause.analysis.yml` | <2% |
| **Duplicate Rate** | `duplicates.report.yml` | <5% |
| **Performance SLA** | `performance.report.yml` | p95 <500ms, errors <0.1% |
| **Accessibility Compliance** | `a11y.report.yml` | WCAG 2.1 AA |
| **Contract Stability** | `contract.validation.yml` | 0 breaking changes без major version |
| **Maturity Level** | `maturity.assessment.yml` | L3+ (оптимизированный) |

