## 🔗 Интеграция с CI/CD

```yaml
# Пример .github/workflows/qa-skills.yml
name: QA Skills Automation

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1-5' # Ежедневно в 02:00 пн-пт

jobs:
  pr-analysis:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Detect PR Changes
        run: npx @kiwi-tcms-ai/kiwi-tcms-skills kiwi-detect-changes-in-pr --pr=${{ github.event.pull_request.number }}
      - name: Sync Test Cases
        run: npx @kiwi-tcms-ai/kiwi-tcms-skills kiwi-sync-test-cases --input=pr.changes.yml
        
  nightly-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Select Regression Tests
        run: npx @kiwi-tcms-ai/kiwi-tcms-skills kiwi-select-tests-for-regression --output=regression-plan.yml
      - name: Run Tests
        run: ./run-tests.sh --plan=regression-plan.yml
      - name: Generate Report
        run: npx @kiwi-tcms-ai/kiwi-tcms-skills kiwi-sprint-report --output=sprint.qa.report.yml
```

