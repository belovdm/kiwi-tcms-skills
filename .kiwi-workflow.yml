## 🔀 Workflow 2: Code Review Pull Request

```yaml
workflow: pr-review
trigger: открыт PR в GitHub/GitLab
steps:
  - step: 1
    skill: kiwi-detect-changes-in-pr
    input: URL или номер PR
    output: pr.changes.yml
    description: Анализ диффа, выявление затронутых компонентов
    
  - step: 2
    skill: kiwi-sync-test-cases
    input: pr.changes.yml
    output: обновлённые тест-кейсы в Kiwi TCMS
    params:
      auto-link: true
    description: Обновление существующих кейсов согласно изменениям
    
  - step: 3
    skill: kiwi-select-tests-for-regression
    input: pr.changes.yml + история запусков
    output: regression-test-plan.yml
    description: Выборка тестов для регрессионного прогона
    
  - step: 4 (опционально)
    skill: kiwi-write-test-cases
    input: контекст PR
    params:
      pr-context: true
    output: новые тест-кейсы в Kiwi TCMS
    description: Создание новых кейсов для новой функциональности в PR
    
  - step: 5 (после мержа)
    skill: kiwi-scan-automation-project
    input: путь к репозиторию
    output: automation-inventory.yml
    description: Актуализация инвентаря автотестов
```

